[package]
name = "simple_gpu"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = { version = "0.38", features = ["linked"] }
ash-window = "0.13.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
gpu-allocator = { version = "0.28.0", features = [
    "vulkan",
    "std",
], default-features = false }
slotmap = "1.1.1"
thread_local = "1.1.10"
winit = "0.30.13"
